<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 환경에서 화면이 축소되거나 비율이 왜곡되지 않도록 고정하는 메타태그 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trust by Design - 피싱 구별 캠페인</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 모바일 프레임 컨테이너 -->
    <div class="phone">

        <!-- 캠페인 화면 이미지 (JS에서 src 변경) -->
        <img id="screen" src="images/home.jpg" alt="피싱 구별 캠페인 화면">

        <!-- [다음 / 시작] 버튼 -->
        <button id="nextBtn" class="interactive-btn"></button>

        <!-- [첫번째] 선택 버튼 -->
        <button id="firstBtn" class="interactive-btn"></button>

        <!-- [두번째] 선택 버튼 -->
        <button id="secondBtn" class="interactive-btn"></button>

    </div>

    <!-- 자바스크립트 연결 -->
    <script src="script.js"></script>
</body>
</html>
